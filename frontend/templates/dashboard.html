<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Intelligence</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<div class="container">

    <header class="header">
        <div>
            <h1>AI Document Intelligence</h1>
            <p>Document Extraction & Financial Validation Platform</p>
        </div>

        <div id="healthStatus" class="health">
            Checking API...
        </div>
    </header>


    <!-- Upload Card -->

    <section class="card">

        <h2>Process Document</h2>

        <form id="uploadForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="documentType">
                        Document Type
                    </label>

                    <select id="documentType" required>
                        <option value="">
                            Select document type
                        </option>

                        <option value="invoice">
                            Invoice
                        </option>

                        <option value="balance_sheet">
                            Balance Sheet
                        </option>

                        <option value="profit_and_loss">
                            Profit & Loss
                        </option>

                        <option value="cash_flow_statement">
                            Cash Flow Statement
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="documentFile">
                        Document
                    </label>

                    <input
                        type="file"
                        id="documentFile"
                        accept=".pdf,.jpg,.jpeg,.png"
                        required
                    >
                </div>

            </div>


            <button
                type="submit"
                id="processButton"
                class="primary-button"
            >
                Process Document
            </button>

        </form>


        <div
            id="uploadMessage"
            class="message hidden"
        ></div>

    </section>


    <!-- Documents -->

    <section class="card">

        <div class="section-header">

            <div>
                <h2>Processed Documents</h2>
                <p>
                    Documents stored in the database
                </p>
            </div>

            <button
                id="refreshButton"
                class="secondary-button"
            >
                Refresh
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Document Name</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Processed At</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="documentsTableBody">

                    <tr>
                        <td colspan="5">
                            Loading documents...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</div>


<script src="/static/js/app.js"></script>

</body>
</html>
